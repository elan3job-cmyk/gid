<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В объективе технологий — Минск</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #f5f7fa; text-align: center; color: #333; }
        header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 1.4rem; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; box-sizing: border-box; }
        #video-container { width: 100%; height: 350px; background: #000; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .result-card { background: white; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #2a5298; text-align: left; display: none; }
        .result-title { font-size: 1.2rem; font-weight: 700; color: #1e3c72; margin: 0 0 10px 0; }
        .result-text { line-height: 1.5; font-size: 0.95rem; color: #4a5568; margin: 0; }
        .status { font-weight: bold; color: #2a5298; margin-top: 20px; }
    </style>
    <!-- Официальный CDN стабильного Vision-пакета MediaPipe Tasks -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
</head>
<body>

    <header>
        <h1>В объективе технологий</h1>
        <p style="margin:5px 0 0 0; font-size:0.85rem; opacity:0.9;">Нейросетевой ИИ-гид по Минску (MediaPipe Core)</p>
    </header>

    <div class="container">
        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <div class="status" id="status">Запуск видеопотока камеры...</div>

        <div class="result-card" id="result-card">
            <h3 class="result-title" id="res-title">Объект</h3>
            <p class="result-text" id="res-history">Историческая справка...</p>
        </div>
    </div>

    <script>
        const MODEL_FILE = 'model.tflite';

        // Патриотическая база данных достопримечательностей
        const CULTURE_DB = {
            0: { title: "Площадь Победы", history: "Памятное место в центре Минска в честь подвига народа в годы Великой Отечественной войны. В центре установлен 38-метровый гранитный монумент, у подножия которого горит Вечный огонь." },
            1: { title: "Музей истории ВОВ", history: "Один из крупнейших в мире музеев, посвященных Второй мировой войне. Открыт в новом величественном здании в 2014 году, символ стойкости народа." },
            2: { title: "Национальная библиотека Беларуси", history: "Уникальное архитектурное здание в форме ромбокубооктаэдра («алмаза знаний»), открытое в 2006 году. Высота составляет 73,6 метра." },
            3: { title: "Красный костёл", history: "Католический храм Святых Симеона и Елены в неоготическом стиле на площади Независимости. Возведен в 1910 году на средства Эдварда Войниловича." },
            4: { title: "Свято-Духов собор", history: "Главный православный храм Минска. Построен в 1633—1642 годах как костел бернардинок, выдающийся образец виленского барокко." }
        };

        let imageClassifier;
        let lastVideoTime = -1;
        const videoElement = document.getElementById('webcam');
        const statusElement = document.getElementById('status');

        // Нативная активация камеры смартфона
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                videoElement.srcObject = stream;
                return new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => { resolve(videoElement); };
                });
            } catch (e) {
                statusElement.innerText = "Ошибка: Доступ к камере заблокирован настройками Android.";
                statusElement.style.color = "red";
                throw e;
            }
        }

        // Инициализация Wasm-классификатора через MediaPipe SDK
        async function init() {
            try {
                await setupCamera();
                statusElement.innerText = "Камера готова. Инициализация ИИ-ядра...";
                
                // Достаем деструктурированные методы из глобального бандла mpSdk
                const vision = await mpSdk.FilesetResolver.forVisionTasks(
                    "https://jsdelivr.net"
                );
                
                statusElement.innerText = "Считывание файла модели model.tflite...";
                
                // Создаем инференс-классификатор модели
                imageClassifier = await mpSdk.ImageClassifier.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: MODEL_FILE,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    maxResults: 1
                });
                
                statusElement.innerText = "ИИ готов! Наведите камеру на памятник.";
                statusElement.style.color = "green";
                
                // Старт постоянного покадрового цикла
                window.requestAnimationFrame(predictLoop);
            } catch (err) {
                statusElement.innerText = "Ошибка ИИ: Не удалось запустить классификатор MediaPipe.";
                statusElement.style.color = "red";
                console.error(err);
            }
        }

        async function predictLoop() {
            if (videoElement.currentTime !== lastVideoTime) {
                lastVideoTime = videoElement.currentTime;
                
                if (imageClassifier) {
                    const startTimeMs = performance.now();
                    const classificationResult = imageClassifier.classifyForVideo(videoElement, startTimeMs);
                    
                    if (classificationResult.classifications && classificationResult.classifications[0].categories.length > 0) {
                        const category = classificationResult.classifications[0].categories[0];
                        const bestScore = category.score;
                        const bestClass = category.categoryName;
                        
                        // Парсим числовой индекс класса (от 0 до 4)
                        let classIndex = parseInt(bestClass);
                        if (isNaN(classIndex)) {
                            if (bestClass.includes("Class 1") || bestClass.includes("0")) classIndex = 0;
                            if (bestClass.includes("Class 2") || bestClass.includes("1")) classIndex = 1;
                            if (bestClass.includes("Class 3") || bestClass.includes("2")) classIndex = 2;
                            if (bestClass.includes("Class 4") || bestClass.includes("3")) classIndex = 3;
                            if (bestClass.includes("Class 5") || bestClass.includes("4")) classIndex = 4;
                        }

                        // Если уверенность ИИ выше 70% — выводим карточку с текстом
                        if (bestScore > 0.70 && CULTURE_DB[classIndex]) {
                            document.getElementById("res-title").innerText = CULTURE_DB[classIndex].title + ` (${(bestScore * 100).toFixed(0)}%)`;
                            document.getElementById("res-history").innerText = CULTURE_DB[classIndex].history;
                            document.getElementById("result-card").style.display = "block";
                        }
                    }
                }
            }
            window.requestAnimationFrame(predictLoop);
        }

        // Старт
        init();
    </script>
</body>
</html>

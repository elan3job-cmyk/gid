<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В объективе технологий — Минск</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            text-align: center;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        #webcam-container {
            width: 100%;
            height: 350px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #2a5298;
            text-align: left;
            display: none;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e3c72;
            margin: 0 0 10px 0;
        }

        .result-text {
            line-height: 1.5;
            font-size: 0.95rem;
            color: #4a5568;
            margin: 0;
        }

        .loader {
            font-weight: bold;
            color: #2a5298;
            margin-top: 20px;
        }

        .bar-container {
            margin-top: 15px;
            background: #e2e8f0;
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            display: none;
        }

        .bar {
            background: #2a5298;
            height: 100%;
            width: 0%;
            transition: width 0.1s;
        }
    </style>
    <!-- Подключаем ИИ-скрипты Google напрямую -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <header>
        <h1>В объективе технологий</h1>
        <p>Интеллектуальный нейросетевой гид по Минску</p>
    </header>

    <div class="container">
        <!-- Окно камеры -->
        <div id="webcam-container"></div>
        <div class="loader" id="status">Инициализация камеры и загрузка ИИ...</div>

        <div class="bar-container" id="bar-container"><div class="bar" id="predict-bar"></div></div>

        <!-- Красивое окно с исторической справкой -->
        <div class="result-card" id="result-card">
            <h3 class="result-title" id="res-title">Объект</h3>
            <p class="result-text" id="res-history">Историческая справка...</p>
        </div>
    </div>

    <script>
        // Ссылка на ВАШУ готовую модель ИИ в облаке Google
        const URL = "./";

        // Историческая патриотическая база данных Минска
        // ВНИМАНИЕ: Названия ("Class 1", "Class 2") должны строго совпадать с тем, как они написаны у вас на Teachable Machine!
        const CULTURE_DB = {
            "Class 1": {
                title: "Площадь Победы",
                history: "Памятное место в центре Минска в честь подвига народа в годы Великой Отечественной войны. В центре установлен 38-метровый гранитный монумент, у подножия которого горит Вечный огонь."
            },
            "Class 2": {
                title: "Музей истории ВОВ",
                history: "Один из крупнейших в мире музеев, посвященных Второй мировой войне. Открыт в новом величественном здании в 2014 году, символ стойкости народа."
            },
            "Class 3": {
                title: "Национальная библиотека Беларуси",
                history: "Уникальное архитектурное здание в форме ромбокубооктаэдра («алмаза знаний»), открытое в 2006 году. Высота составляет 73,6 метра."
            },
            "Class 4": {
                title: "Красный костёл",
                history: "Католический храм Святых Симеона и Елены в неоготическом стиле на площади Независимости. Возведен в 1910 году на средства Эдварда Войниловича."
            },
            "Class 5": {
                title: "Свято-Духов собор",
                history: "Главный православный храм Минска. Построен в 1633—1642 годах как костел бернардинок, выдающийся образец виленского барокко."
            }
        };

        let model, webcam, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                // Загружаем ИИ-модель прямо в браузер устройства
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Настройка камеры мобильного телефона (environment — задняя камера)
                const flip = false;
                webcam = new tmImage.Webcam(350, 350, flip);
                await webcam.setup({ facingMode: "environment" });
                await webcam.play();

                // Скрываем надпись загрузки и выводим видеопоток
                document.getElementById("status").style.display = "none";
                document.getElementById("bar-container").style.display = "block";
                document.getElementById("webcam-container").appendChild(webcam.canvas);

                // Запуск непрерывного цикла распознавания кадров
                window.requestAnimationFrame(loop);
            } catch (e) {
                document.getElementById("status").innerText = "Ошибка доступа к камере. Откройте сайт через HTTPS в Chrome!";
                console.error(e);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);

            // Ищем класс с максимальной уверенностью нейросети
            let bestClass = "";
            let bestScore = 0;
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > bestScore) {
                    bestScore = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            // Визуализируем точность в виде полоски
            document.getElementById("predict-bar").style.width = (bestScore * 100) + "%";

            // Если уверенность ИИ выше 75%, выводим карточку с историей из базы
            if (bestScore > 0.75 && CULTURE_DB[bestClass]) {
                document.getElementById("res-title").innerText = CULTURE_DB[bestClass].title + ` (${(bestScore * 100).toFixed(0)}%)`;
                document.getElementById("res-history").innerText = CULTURE_DB[bestClass].history;
                document.getElementById("result-card").style.display = "block";
            }
        }

        // Запуск
        init();
    </script>
</body>
</html>

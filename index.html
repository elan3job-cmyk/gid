<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В объективе технологий — Минск</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background-color: #f5f7fa; text-align: center; color: #333; }
        header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px 0; }
        h1 { margin: 0; font-size: 1.4rem; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; box-sizing: border-box; }
        #video-container { width: 100%; height: 350px; background: #000; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .result-card { background: white; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #2a5298; text-align: left; display: none; }
        .result-title { font-size: 1.2rem; font-weight: 700; color: #1e3c72; margin: 0 0 10px 0; }
        .result-text { line-height: 1.5; font-size: 0.95rem; color: #4a5568; margin: 0; }
        .status { font-weight: bold; color: #2a5298; margin-top: 20px; }
    </style>
    <!-- Подключаем только ml5.js для стабильной обработки ИИ без тяжелой p5.js -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <header>
        <h1>В объективе технологий</h1>
        <p style="margin:5px 0 0 0; font-size:0.85rem; opacity:0.9;">Нейросетевой ИИ-гид по Минску</p>
    </header>

    <div class="container">
        <div id="video-container">
            <!-- Нативный тег видео для железной активации камеры на Android -->
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <div class="status" id="status">Запуск видеопотока камеры...</div>

        <div class="result-card" id="result-card">
            <h3 class="result-title" id="res-title">Объект</h3>
            <p class="result-text" id="res-history">Историческая справка...</p>
        </div>
    </div>

    <script>
        // Облачная ссылка на вашу рабочую модель Teachable Machine
        const modelURL = 'https://withgoogle.com';

        const CULTURE_DB = {
            "Class 1": { title: "Площадь Победы", history: "Памятное место в центре Минска в честь подвига народа в годы Великой Отечественной войны. В центре установлен 38-метровый гранитный монумент, у подножия которого горит Вечный огонь." },
            "Class 2": { title: "Музей истории ВОВ", history: "Один из крупнейших в мире музеев, посвященных Второй мировой войне. Открыт в новом величественном здании в 2014 году, символ стойкости народа." },
            "Class 3": { title: "Национальная библиотека Беларуси", history: "Уникальное архитектурное здание в форме ромбокубооктаэдра («алмаза знаний»), открытое в 2006 году. Высота составляет 73,6 метра." },
            "Class 4": { title: "Красный костёл", history: "Католический храм Святых Симеона и Елены в неоготическом стиле на площади Независимости. Возведен в 1910 году на средства Эдварда Войниловича." },
            "Class 5": { title: "Свято-Духов собор", history: "Главный православный храм Минска. Построен в 1633—1642 годах как костел бернардинок, выдающийся образец виленского барокко." }
        };

        let classifier;
        const videoElement = document.getElementById('webcam');
        const statusElement = document.getElementById('status');

        // Шаг 1: Гарантированный нативный запуск видеопотока через браузер Android
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }, // Задняя камера смартфона
                    audio: false
                });
                videoElement.srcObject = stream;
                return new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => {
                        resolve(videoElement);
                    };
                });
            } catch (e) {
                statusElement.innerText = "Ошибка: Доступ к камере заблокирован смартфоном.";
                statusElement.style.color = "red";
                throw e;
            }
        }

        // Шаг 2: Инициализация ИИ-модели через ml5.js
        async function init() {
            try {
                await setupCamera();
                statusElement.innerText = "Камера подключена. Интеграция с ИИ-моделью...";
                
                // Загружаем классификатор ml5 без p5-зависимостей
                classifier = await ml5.imageClassifier(modelURL + 'model.json', videoElement);
                
                statusElement.innerText = "ИИ успешно загружен! Наведите камеру на объект.";
                statusElement.style.color = "green";
                
                // Запускаем непрерывный цикл распознавания кадров
                classifyVideo();
            } catch (err) {
                statusElement.innerText = "Ошибка загрузки модели. Проверьте соединение.";
                statusElement.style.color = "red";
                console.error(err);
            }
        }

        function classifyVideo() {
            if (classifier) {
                classifier.classify(videoElement, gotResult);
            }
        }

        function gotResult(error, results) {
            if (error) {
                console.error(error);
                return;
            }
            
            if (results && results.length > 0) {
                let bestResult = results[0]; // Элемент с наивысшей уверенностью ИИ
                let bestClass = bestResult.label;
                let bestScore = bestResult.confidence;

                // Если точность ИИ выше 75%, выводим карточку с историей
                if (bestScore > 0.75 && CULTURE_DB[bestClass]) {
                    document.getElementById("res-title").innerText = CULTURE_DB[bestClass].title + ` (${(bestScore * 100).toFixed(0)}%)`;
                    document.getElementById("res-history").innerText = CULTURE_DB[bestClass].history;
                    document.getElementById("result-card").style.display = "block";
                }
            }
            
            // Запрос на обработку следующего кадра видеопотока
            classifyVideo();
        }

        // Старт системы
        init();
    </script>
</body>
</html>

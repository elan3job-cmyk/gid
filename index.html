<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В объективе технологий — Минск</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #f5f7fa; text-align: center; color: #333; }
        header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 1.4rem; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; box-sizing: border-box; }
        #video-container { width: 100%; height: 350px; background: #000; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .menu-title { font-size: 1rem; font-weight: bold; margin-top: 20px; color: #4a5568; text-align: left; }
        .grid-buttons { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
        .btn-landmark { background-color: white; color: #2a5298; border: 2px solid #2a5298; padding: 12px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; }
        .btn-landmark:hover { background-color: #2a5298; color: white; }
        
        .result-card { background: white; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #2a5298; text-align: left; display: none; animation: fadeIn 0.3s ease-in-out; }
        .result-title { font-size: 1.2rem; font-weight: 700; color: #1e3c72; margin: 0 0 10px 0; }
        .result-text { line-height: 1.5; font-size: 0.95rem; color: #4a5568; margin: 0; }
        .status { font-weight: bold; color: #2b6cb0; margin-top: 15px; font-size: 0.9rem; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>В объективе технологий</h1>
        <p style="margin:5px 0 0 0; font-size:0.85rem; opacity:0.9;">Интерактивный цифровой гид по Минску</p>
    </header>

    <div class="container">
        <!-- Окно камеры -->
        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <div class="status" id="status">Камера смартфона успешно подключена ✓</div>

        <!-- Кнопки выбора объектов -->
        <div class="menu-title">Выберите исторический объект в объективе:</div>
        <div class="grid-buttons">
            <button class="btn-landmark" onclick="showHistory(0)">📍 Площадь Победы</button>
            <button class="btn-landmark" onclick="showHistory(1)">📍 Музей истории Великой Отечественной войны</button>
            <button class="btn-landmark" onclick="showHistory(2)">📍 Национальная библиотека Беларуси</button>
            <button class="btn-landmark" onclick="showHistory(3)">📍 Красный костёл (храм Св. Симеона и Елены)</button>
            <button class="btn-landmark" onclick="showHistory(4)">📍 Свято-Духов кафедральный собор</button>
        </div>

        <!-- Окно с исторической справкой -->
        <div class="result-card" id="result-card">
            <h3 class="result-title" id="res-title">Объект</h3>
            <p class="result-text" id="res-history">Историческая справка...</p>
        </div>
    </div>

    <script>
        // Историческая патриотическая база данных
        const CULTURE_DB = {
            0: { title: "Площадь Победы", history: "Памятное место в центре Минска в честь подвига народа в годы Великой Отечественной войны. В центре установлен 38-метровый гранитный монумент, у подножия которого горит Вечный огонь." },
            1: { title: "Музей истории ВОВ", history: "Один из крупнейших в мире музеев, посвященных Второй мировой войне. Открыт в новом величественном здании в 2014 году, увенчанном сияющим куполом Славы." },
            2: { title: "Национальная библиотека Беларуси", history: "Уникальное архитектурное здание в форме ромбокубооктаэдра («алмаза знаний»), открытое в 2006 году. Высота главного книгохранилища страны составляет 73,6 метра." },
            3: { title: "Красный костёл", history: "Католический храм Святых Симеона и Елены в неоготическом стиле на площади Независимости. Возведен в 1910 году архитекторами на средства политического деятеля Эдварда Войниловича." },
            4: { title: "Свято-Духов собор", history: "Главный православный храм Минска. Построен в 1633—1642 годах как костел католического монастыря бернардинок, является выдающимся образцом виленского барокко." }
        };

        const videoElement = document.getElementById('webcam');
        const statusElement = document.getElementById('status');

        // Нативный запуск видеопотока (без сторонних библиотек ИИ)
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }, // Активация задней камеры смартфона
                    audio: false
                });
                videoElement.srcObject = stream;
            } catch (e) {
                statusElement.innerText = "Внимание: Предоставьте доступ к камере в настройках браузера Chrome.";
                statusElement.style.color = "orange";
                console.warn(e);
            }
        }

        // Функция вывода карточки достопримечательности
        function showHistory(index) {
            if (CULTURE_DB[index]) {
                document.getElementById("res-title").innerText = CULTURE_DB[index].title;
                document.getElementById("res-history").innerText = CULTURE_DB[index].history;
                document.getElementById("result-card").style.display = "block";
                
                // Плавный скролл к тексту, чтобы пользователю было удобно читать на смартфонане
                document.getElementById("result-card").scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Автостарт камеры при загрузке страницы
        setupCamera();
    </script>
</body>
</html>
